name: Generate Purple Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-purple.svg?color_snake=#A855F7&color_dots=#2a2238,#3b1a66,#6d28d9,#9333ea,#c084fc
            dist/snake-purple.gif?color_snake=#A855F7&color_dots=#2a2238,#3b1a66,#6d28d9,#9333ea,#c084fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
